version: "3"

services:
    filebrowser:
        image: filebrowser/filebrowser:s6
        container_name: filebrowser
        networks:
            - traefik_traefik_net
        volumes:
            - 'filebrowser_data:/config'
            - 'filebrowser_db:/database'
            - '${SRV_DIRECTORY}:/srv'
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.filebrowser.entrypoints=http"
            - "traefik.http.routers.filebrowser.rule=Host(`filebrowser.local.box`)"
        environment:
            PUID: ${PUID}
            PGID: ${PGID}
        restart: unless-stopped

volumes:
    filebrowser_data:
        driver: local
    filebrowser_db:
        driver: local
